name: Keep API awake

# Render's free tier sleeps after about 15 minutes without traffic, which makes
# the first visitor wait up to a minute. A request every 10 minutes prevents that.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: curl -fsS --max-time 90 --retry 2 https://riskflow-api-1odp.onrender.com/api/pipeline/health > /dev/null

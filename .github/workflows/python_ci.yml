name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Unit and API tests
        run: python -m pytest tests -q

      - name: Latency benchmark (in-process, 1000 requests)
        run: python backend/benchmark_latency.py -n 1000

      - name: Upload latency report
        uses: actions/upload-artifact@v4
        with:
          name: latency-report
          path: backend/latency_report.json
